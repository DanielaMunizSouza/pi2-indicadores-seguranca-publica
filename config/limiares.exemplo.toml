# Copie para config/limiares.toml (ou aponte GEOHABITA_LIMIARES) para ajustar os
# limiares do diagnóstico sem alterar o código (RN13). Reinicie a API e rode a
# etapa `indicadores` do pipeline depois de mudar.
#
# Valores aqui = os da especificação; [densidade] vale só para tipos medidos por
# densidade (hoje apenas iluminacao_publica).

[distancia]
praca = { ideal_m = 400, maxima_m = 1200 }
parque_area_verde = { ideal_m = 400, maxima_m = 1200 }
biblioteca_centro_cultural = { ideal_m = 800, maxima_m = 2000 }
ceu_equipamento_esportivo = { ideal_m = 800, maxima_m = 2000 }
ponto_onibus = { ideal_m = 300, maxima_m = 800 }
estacao_metro_trem = { ideal_m = 800, maxima_m = 2000 }
ciclovia = { ideal_m = 800, maxima_m = 2000 }
feira_mercado_municipal = { ideal_m = 800, maxima_m = 1500 }
unidade_basica_saude = { ideal_m = 800, maxima_m = 2000 }
escola_publica = { ideal_m = 800, maxima_m = 2000 }
wifi_publico = { ideal_m = 400, maxima_m = 1200 }

[densidade]
iluminacao_publica = { raio_m = 300, zero = 150, cem = 1500 }

# Parques de conservação e naturais (acesso restrito): contam como área verde com
# a nota multiplicada pelo fator, e no IVEP cada um vale "fator" parque.
[acesso_restrito]
parque_conservacao = { fator = 0.3 }
