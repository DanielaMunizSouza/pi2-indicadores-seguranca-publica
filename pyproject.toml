[project]
name = "geohabita"
version = "0.1.0"
description = "Indicadores de segurança pública e vitalidade urbana para o município de São Paulo."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
