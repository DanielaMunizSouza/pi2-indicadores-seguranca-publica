[pytest]
# A suíte vive em tests/; o pacote geohabita fica na raiz do repositório.
testpaths = tests
pythonpath = .
# Opções padrão: mostra o resumo dos testes que não passaram.
addopts = -ra
# Marcadores de testes que exigem ambiente além do Python (CI roda cada grupo em um job).
markers =
    integracao: testes com banco PostGIS real; precisam de DATABASE_URL
    e2e: testes de interface com Playwright e axe-core
